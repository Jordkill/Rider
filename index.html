<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ride Clans – Trottinettes</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#f3f1ea;--sf:#fff;--tx:#14181f;--mu:#6a707c;--ac:#ffc933;--acx:#14181f;--ln:#dcd9cf}
@media (prefers-color-scheme:dark){:root{--bg:#0b0d12;--sf:#171a22;--tx:#f4f4f1;--mu:#8d93a0;--ln:#262b36}}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:15px/1.4 "Trebuchet MS","Segoe UI",system-ui,sans-serif;overflow:hidden}
#app{height:100%;display:none;flex-direction:column;max-width:560px;margin:0 auto;position:relative}
main{flex:1;position:relative;overflow:hidden}
.pg{position:absolute;inset:0;overflow-y:auto;padding:16px;display:none}
.pg.on{display:block}
#pg-map{padding:0;overflow:hidden}
.full{position:fixed;inset:0;z-index:2000;background:var(--bg);overflow-y:auto;padding:20px;display:none}
.full>div{max-width:460px;margin:0 auto}
nav{display:flex;background:var(--sf);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0)}
nav button{flex:1;padding:10px 0 9px;background:none;border:0;color:var(--mu);font:inherit;font-size:12px;cursor:pointer}
nav button b{display:block;font-size:19px;font-weight:400}
nav button.on{color:var(--tx);font-weight:700}
button:focus-visible,input:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
h1{font:800 26px/1.1 Georgia,"Times New Roman",serif;letter-spacing:-.5px;margin:4px 0 14px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:10px}
.btn{background:var(--ac);color:var(--acx);border:0;border-radius:12px;padding:12px 16px;font:700 15px inherit;font-family:inherit;cursor:pointer;width:100%}
.btn.sm{width:auto;padding:7px 13px;font-size:13px;border-radius:9px}
.btn.ghost{background:transparent;border:1.5px solid var(--ln);color:var(--tx)}
input[type=text],input[type=email],input[type=password],select{width:100%;padding:12px;border-radius:12px;border:1.5px solid var(--ln);background:var(--sf);color:var(--tx);font:inherit;margin-bottom:10px}
label.mu{display:block;margin-bottom:3px}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1;min-width:0}
.mu{color:var(--mu);font-size:13px}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#14181f;flex:none}
.tag{font-size:12px;background:var(--bg);border-radius:6px;padding:2px 7px;color:var(--mu)}
.chip{display:inline-block;background:var(--ac);color:var(--acx);border-radius:9px;padding:6px 10px;font-size:13px;font-weight:700;text-decoration:none;margin:8px 6px 0 0}
#map{position:absolute;inset:0;z-index:1}
.pin{position:relative;width:30px;height:30px;border-radius:50%;border:3px solid #14181f;display:grid;place-items:center;font:800 13px sans-serif;color:#14181f}
.vb{position:absolute;right:-10px;bottom:-10px;font-size:13px;line-height:1}
.hud{position:absolute;left:12px;right:12px;top:12px;z-index:500;display:flex;flex-direction:column;gap:8px}
.pill{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:9px 12px;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.xpbar{height:6px;background:var(--ln);border-radius:3px;overflow:hidden;flex:1}
.xpbar i{display:block;height:100%;background:var(--ac)}
.sw{position:relative;width:46px;height:26px;border-radius:13px;background:var(--ln);border:0;cursor:pointer;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on{background:var(--ac)}.sw.on::after{left:23px}
#go{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);z-index:500;width:84px;height:84px;border-radius:50%;border:0;background:var(--ac);color:var(--acx);font:800 24px Georgia,serif;box-shadow:0 6px 18px rgba(0,0,0,.3);cursor:pointer}
#go.run{background:#e5484d;color:#fff;font-size:15px}
#stat,#sheet{position:absolute;left:12px;right:12px;bottom:118px;z-index:500}
#sheet{display:none}
.seg{display:flex;background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:9px;font:inherit;color:var(--mu);cursor:pointer}
.seg button.on{background:var(--ac);color:var(--acx);font-weight:700}
.rank{width:26px;text-align:center;font-weight:800;color:var(--mu)}
#toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:3000;max-width:92%;text-align:center}
#toast.on{opacity:1}
.fab{position:absolute;z-index:500;width:46px;height:46px;border-radius:50%;border:1px solid var(--ln);background:var(--sf);color:var(--tx);font-size:20px;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.2)}
#sos{left:12px;bottom:34px}#addp{right:12px;bottom:34px}
.fl{display:flex;gap:6px;overflow-x:auto}
.fl button{flex:none;border:1.5px solid var(--ln);background:var(--sf);color:var(--tx);border-radius:999px;padding:4px 10px;font:inherit;font-size:13px;cursor:pointer}
.fl button.on{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:700}
.bar{height:8px;background:var(--ln);border-radius:4px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--ac)}
.bd{display:inline-block;margin:0 6px 6px 0;padding:5px 9px;border-radius:9px;background:var(--bg);font-size:13px;opacity:.45}.bd.on{opacity:1;background:var(--ac);color:var(--acx);font-weight:700}
.pn{font-size:22px;line-height:1;text-align:center}
textarea,input[type=datetime-local]{width:100%;padding:12px;border-radius:12px;border:1.5px solid var(--ln);background:var(--sf);color:var(--tx);font:inherit;margin-bottom:10px}
</style>
</head>
<body>
<div class="full" id="auth" style="display:block"><div>
 <h1>Ride Clans</h1>
 <p class="mu" style="margin-bottom:16px">Trouve des riders près de toi et rejoins un clan.</p>
 <input type="email" id="em" placeholder="Email" autocomplete="email" aria-label="Email">
 <input type="password" id="pw" placeholder="Mot de passe (6 caractères min.)" autocomplete="current-password" aria-label="Mot de passe">
 <div class="row"><button class="btn" id="li">Se connecter</button><button class="btn ghost" id="su">Créer un compte</button></div>
 <p class="mu" style="margin-top:14px"><a href="privacy.html" style="color:var(--mu)">Politique de confidentialité</a></p>
 <p class="mu"><a href="#" id="tst" style="color:var(--mu)">Tester la connexion</a></p>
</div></div>
<div class="full" id="reg"><div></div></div>
<div class="full" id="modal"><div></div></div>
<div class="full" id="picker" style="z-index:2500"><div><h1>Choisir le lieu</h1><div class="row" style="margin-bottom:8px"><input type="text" id="qs" placeholder="Chercher une adresse ou un lieu" style="margin:0"><button class="btn sm" id="qb">OK</button></div><div id="pmap" style="height:48vh;border-radius:12px;margin-bottom:8px"></div><p class="mu" style="margin-bottom:10px">Appuie sur la carte ou fais glisser le repère 📍, puis valide.</p><button class="btn" id="pv">Valider ce lieu</button><button class="btn ghost" id="pg" style="margin-top:8px">Utiliser ma position</button><button class="btn ghost" id="pc" style="margin-top:8px">Annuler</button></div></div>
<div id="app">
<main>
 <section class="pg on" id="pg-map">
  <div id="map"></div>
  <div class="hud">
   <div class="pill row"><span class="mu" style="font-size:12px">Niv. <b id="lvl" style="color:var(--tx)">1</b></span><div class="xpbar"><i id="xpb"></i></div><span class="mu" id="xpt"></span></div>
   <div class="pill row"><div class="sp"><b>Je suis visible</b><div class="mu" id="vtxt"></div></div><button class="sw on" id="vis" role="switch" aria-checked="true" aria-label="Visible sur la carte"></button></div>
  </div>
  <div id="stat" class="pill"></div>
  <div id="sheet" class="pill"></div>
  <button id="go">GO</button>
  <button class="fab" id="sos" aria-label="Sécurité : SOS et partage de position">🆘</button><button class="fab" id="addp" aria-label="Ajouter un point sur la carte">＋</button>
 </section>
 <section class="pg" id="pg-ev"></section>
 <section class="pg" id="pg-clans"></section>
 <section class="pg" id="pg-rank"></section>
 <section class="pg" id="pg-me"></section>
</main>
<nav>
 <button class="on" data-p="map"><b>🗺</b>Carte</button>
 <button data-p="ev"><b>📅</b>Sorties</button>
 <button data-p="clans"><b>🛡</b>Clans<span id="nb"></span></button>
 <button data-p="rank"><b>🏆</b>Classement</button>
 <button data-p="me"><b>👤</b>Profil</button>
</nav>
</div>
<div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const COLORS=["#ffc933","#7fd6a8","#ff9b8a","#8fb8ff","#d3a6ff","#ffb86b"];
const colOf=id=>COLORS[[...String(id)].reduce((a,c)=>a+c.charCodeAt(0),0)%6];
const STALE=5*60*1000,lvlOf=x=>Math.floor(x/150)+1,age=r=>Date.now()-Date.parse(r.t);
const CT=[["sn","Snapchat","pseudo","https://www.snapchat.com/add/"],["wa","WhatsApp","+33612345678","https://wa.me/"],["tel","Téléphone (SMS)","+33612345678","sms:"],["ig","Instagram","pseudo","https://instagram.com/"],["tg","Telegram","pseudo","https://t.me/"],["tt","TikTok","pseudo","https://www.tiktok.com/@"],["dc","Discord","pseudo (pas de lien)",""]];
const CC=[["wa","Groupe WhatsApp","https://chat.whatsapp.com/…"],["dc","Discord","https://discord.gg/…"],["tg","Telegram","https://t.me/…"],["sn","Snapchat du chef","pseudo"]];
const VEH={trot:["🛴","Trottinette"],trote:["🛴⚡","Trottinette électrique"],velo:["🚲","Vélo"],velo_e:["🚲⚡","Vélo électrique"]};
function link(k,v){v=String(v||"").trim();const d=CT.find(c=>c[0]===k);if(!v||!d)return"";const x=k==="wa"?v.replace(/\D/g,""):k==="tel"?v.replace(/[^\d+]/g,""):encodeURIComponent(v.replace(/^@/,""));return x?d[3]+x:""}
function clink(k,v){v=String(v||"").trim();if(!v)return"";if(k==="sn")return "https://www.snapchat.com/add/"+encodeURIComponent(v.replace(/^@/,""));
 return /^https:\/\/(chat\.whatsapp\.com|discord\.gg|discord\.com\/invite|t\.me)\/[\w\-\/.?=&]+$/i.test(v)?v:""}
function chips(ct,list,fn){return ct?list.filter(c=>ct[c[0]]).map(c=>{if(fn===link&&c[0]==="dc")return `<span class="chip">Discord · ${esc(ct.dc)}</span>`;const u=fn(c[0],ct[c[0]]);if(!u)return"";const v=String(ct[c[0]]);return `<a class="chip" href="${u}" target="_blank" rel="noopener noreferrer">${c[1]}${/^https?:/.test(v)?"":" · "+esc(v)}</a>`}).join(""):""}
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),3200)}
const fail=e=>{console.error(e);toast("Action refusée ou erreur réseau")};
const chk=({error})=>{if(error)fail(error)};
function hav(a,b){const R=6371000,r=Math.PI/180,dl=(b.lat-a.lat)*r,dn=(b.lng-a.lng)*r,x=Math.sin(dl/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(x))}

const CFG=window.SB||{};CFG.url=String(CFG.url||"").replace(/[^\x21-\x7E]/g,"").replace(/\/+$/,"");CFG.key=String(CFG.key||"").replace(/[^\x21-\x7E]/g,"");const cfgOk=CFG.url&&CFG.key&&!/COLLE/.test(CFG.url+CFG.key);
const sb=cfgOk?supabase.createClient(CFG.url,CFG.key):null;
let uid=null,pos=null,watching=false,riding=false,lastW=0,page="map",riders=[],clans=[],reqs=[],started=false,prevN=0,geoErr="";
let me={n:"",v:"trot",g:"",km:0,sos:"",xp:0,clan:"",cn:"",vis:true,ct:{},share:true,reg:false};
const reqIn=()=>reqs.filter(r=>r.tu===uid&&r.st==="pending"),reqOut=()=>reqs.filter(r=>r.f===uid);

/* ---------- connexion par email ---------- */
const errMsg=e=>{const m=e&&e.message||"";return /already/i.test(m)?"Cet email a déjà un compte : appuie sur Se connecter":/invalid login/i.test(m)?"Email ou mot de passe incorrect":/at least 6/i.test(m)?"Mot de passe trop court (6 caractères min.)":/valid email|invalid format/i.test(m)?"Email invalide":/not confirmed/i.test(m)?"Confirme d'abord ton email":/rate limit/i.test(m)?"Trop d'essais, réessaie dans quelques minutes":/fetch|network/i.test(m)?"Connexion impossible ("+m.slice(0,70)+"). Appuie sur « Tester la connexion » en bas.":m||"Erreur de connexion"};
async function doAuth(up){
 if(!sb)return toast("config.js n'est pas rempli");
 const email=$("#em").value.trim(),password=$("#pw").value;if(!email||!password)return toast("Entre un email et un mot de passe");
 try{const r=up?await sb.auth.signUp({email,password}):await sb.auth.signInWithPassword({email,password});
  if(r.error)return toast(errMsg(r.error));
  if(up&&!r.data.session)toast("Compte créé. Confirme ton email, puis connecte-toi.");
 }catch(e){toast(errMsg(e))}
}
$("#li").onclick=()=>doAuth(false);$("#su").onclick=()=>doAuth(true);
$("#tst").onclick=async e=>{e.preventDefault();if(!sb)return toast("config.js n'est pas rempli");
 try{const r=await fetch(CFG.url+"/auth/v1/health",{headers:{apikey:CFG.key}});toast("Serveur joint : HTTP "+r.status+" "+(await r.text()).slice(0,100))}catch(err){toast("Échec : "+(err&&err.message||err)+" | url="+CFG.url.slice(0,30)+"… clé="+CFG.key.length+" car.")}};
if(!sb)toast("config.js n'est pas rempli");
else sb.auth.onAuthStateChange((ev,s)=>setTimeout(()=>onUser(s&&s.user),0));
async function onUser(u){
 if(!u){uid=null;started=false;me.reg=false;$("#app").style.display="none";$("#reg").style.display="none";$("#auth").style.display="block";return}
 if(uid===u.id&&started)return;
 uid=u.id;$("#auth").style.display="none";
 try{
  const [a,b]=await Promise.all([sb.from("profiles").select("*").eq("id",uid).maybeSingle(),sb.from("priv").select("*").eq("id",uid).maybeSingle()]);
  if(a.data){const d=a.data;me.km=d.km||0;me.g=d.g||"";me.n=d.n||"";me.v=VEH[d.v]?d.v:"trot";me.xp=d.xp||0;me.clan=d.clan||"";me.cn=d.cn||"";me.vis=d.vis!==false}
  if(b.data){me.sos=b.data.sos||"";me.ct=b.data.ct||{};me.share=b.data.share!==false;me.reg=true}
 }catch(e){fail(e)}
 if(me.reg)start();else showReg();
}

/* ---------- inscription et profil ---------- */
function formHtml(btn,age){return `<label class="mu">Pseudo</label><input type="text" id="f-n" value="${esc(me.n)}" maxlength="20"><label class="mu">Mon véhicule</label><select id="f-v">${Object.entries(VEH).map(([k,v])=>`<option value="${k}" ${me.v===k?"selected":""}>${v[0]} ${v[1]}</option>`).join("")}</select><label class="mu">Mon modèle (garage)</label><input type="text" id="f-g" value="${esc(me.g)}" placeholder="ex : Zedos Z1, Xiaomi 4 Pro…" maxlength="40"><div class="mu" style="margin:6px 0 10px"><b style="color:var(--tx)">Où les autres peuvent te contacter</b><br>Remplis les réseaux que tu utilises. <b style="color:var(--tx)">Au moins un numéro de téléphone est obligatoire</b> (WhatsApp ou Téléphone).</div>`+CT.map(c=>`<label class="mu">${c[1]}</label><input type="text" id="f-${c[0]}" value="${esc(me.ct[c[0]]||"")}" placeholder="${c[2]}" maxlength="40">`).join("")+`<label class="mu">Numéro SOS (privé, utilisé par le bouton 🆘)</label><input type="text" id="f-sos" value="${esc(me.sos)}" placeholder="+33612345678" maxlength="20"><label class="row" style="margin-bottom:12px"><input type="checkbox" id="f-s" ${me.share?"checked":""}><span class="mu sp">Afficher mes contacts aux riders qui appuient sur mon profil (visibles par tous les utilisateurs connectés).</span></label>`+(age?`<label class="row" style="margin-bottom:12px"><input type="checkbox" id="f-a"><span class="mu sp">J'ai 16 ans ou plus et j'accepte la <a href="privacy.html" target="_blank" style="color:var(--mu)">politique de confidentialité</a>.</span></label>`:"")+`<button class="btn" id="f-b">${btn}</button>`}
const phoneOk=v=>{v=String(v||"");const n=v.replace(/\D/g,"");return /^\+?[\d\s.\-()]+$/.test(v)&&n.length>=8&&n.length<=15};
function formError(){const w=me.ct.wa,t=me.ct.tel;
 if(!w&&!t)return "Ajoute au moins un numéro de téléphone (WhatsApp ou Téléphone)";
 if(w&&!phoneOk(w))return "Numéro WhatsApp invalide (ex : +33612345678)";
 if(t&&!phoneOk(t))return "Numéro de téléphone invalide (ex : +33612345678)";
 if(me.sos&&!phoneOk(me.sos))return "Numéro SOS invalide (ex : +33612345678)";return ""}
function readForm(){me.n=$("#f-n").value.trim();me.v=$("#f-v").value;me.g=$("#f-g").value.trim();me.sos=$("#f-sos").value.trim();CT.forEach(c=>me.ct[c[0]]=$("#f-"+c[0]).value.trim());me.share=$("#f-s").checked}
async function saveProfile(){await Promise.all([push(true),sb.from("priv").upsert({id:uid,ct:me.ct,share:me.share,sos:me.sos}).then(chk)])}
function showReg(){
 const r=$("#reg");r.style.display="block";
 r.firstElementChild.innerHTML=`<h1>Crée ton profil</h1><p class="mu" style="margin-bottom:14px">Choisis un pseudo, ton véhicule et comment les autres peuvent te contacter. Les contacts sont facultatifs.</p>`+formHtml("Créer mon profil",true)+`<button class="btn ghost" id="lo" style="margin-top:10px">Se déconnecter</button>`;
 $("#lo").onclick=()=>sb.auth.signOut();
 $("#f-b").onclick=async()=>{readForm();if(!me.n)return toast("Choisis un pseudo");{const er=formError();if(er)return toast(er)}if(!$("#f-a").checked)return toast("Tu dois accepter pour continuer");
  me.reg=true;await saveProfile();r.style.display="none";start()};
}
function renderMe(){
 $("#pg-me").innerHTML=`<h1>Profil</h1>${statsHtml()}<div class="card"><div class="mu" style="margin-bottom:10px">Niveau ${lvlOf(me.xp)} · ${Math.round(me.xp)} XP · ${me.clan?"Clan "+esc(me.cn):"Pas de clan"}</div>${formHtml("Enregistrer")}</div><button class="btn ghost" id="lo">Se déconnecter</button><p class="mu" style="margin-top:12px"><a href="privacy.html" style="color:var(--mu)">Politique de confidentialité</a></p>`;
 $("#f-b").onclick=async()=>{readForm();if(!me.n)return toast("Choisis un pseudo");{const er=formError();if(er)return toast(er)}await saveProfile();toast("Profil enregistré");renderMe()};bindStats();
 $("#lo").onclick=()=>sb.auth.signOut();
}

/* ---------- données partagées ---------- */
function push(force){
 if(!uid||!me.reg)return Promise.resolve();const now=Date.now();if(!force&&now-lastW<6000)return Promise.resolve();lastW=now;const show=me.vis&&pos;
 return sb.from("profiles").upsert({id:uid,n:me.n,v:me.v,g:me.g,km:Math.round(me.km*10)/10,lat:show?pos.lat:null,lng:show?pos.lng:null,xp:Math.round(me.xp),clan:me.clan||null,cn:me.cn||null,vis:me.vis,ct:me.share?me.ct:null,t:new Date().toISOString()}).then(chk);
}
function live(table,cb){
 const m=new Map(),out=()=>cb([...m.values()]);
 sb.from(table).select("*").then(({data})=>{(data||[]).forEach(r=>m.set(r.id,r));out()});
 sb.channel("rt-"+table).on("postgres_changes",{event:"*",schema:"public",table},p=>{if(p.eventType==="DELETE")m.delete(p.old.id);else m.set(p.new.id,p.new);out()}).subscribe();
}
function start(){
 $("#app").style.display="flex";map.invalidateSize();hud();
 if(started)return;started=true;
 live("profiles",a=>{riders=a;drawMarkers();if(page==="map")hud();if(page==="clans"){if(me.clan)renderMine();renderList();renderRes()}});
 live("clans",a=>{clans=a;fltUI();if(page==="clans"){if(me.clan)renderMine();renderList()}});
 live("requests",a=>{reqs=a;const n=reqIn().length;$("#nb").textContent=n?" ("+n+")":"";if(n>prevN)toast("Nouvelle demande de clan");prevN=n;
  reqOut().filter(r=>r.k==="join"&&r.st==="accepted").forEach(r=>{if(me.clan!==r.c)joinClan(r.c,r.cn);sb.from("requests").update({st:"done"}).eq("id",r.id).then(()=>{})});
  if(page==="clans"){renderReqs();renderList();renderRes()}});
 live("pins",a=>{pins=a;drawPins()});
 live("events",a=>{events=a;drawPins();if(page==="ev")renderEv()});
 live("rsvps",a=>{rsvps=a;if(page==="ev")renderEv()});
 live("ads",a=>{ads=a;if(page==="ev")renderEv()});

const near=()=>riders.filter(r=>r.id!==uid&&r.vis!==false&&r.lat!=null&&age(r)<STALE&&(!pos||hav(pos,r)<30000)&&(F.v==="all"||r.v===F.v)&&(!F.clan||!me.clan||r.clan===me.clan));
const ic=r=>L.divIcon({className:"",html:`<div class="pin" style="background:${colOf(r.id)}">${esc((r.n||"?")[0].toUpperCase())}<span class="vb">${VEH[r.v]?VEH[r.v][0]:"🛴"}</span></div>`,iconSize:[30,30],iconAnchor:[15,15]});
function drawMarkers(){
 const keep=new Set();
 near().forEach(r=>{keep.add(r.id);let m=mk[r.id];if(!m){m=mk[r.id]=L.marker([r.lat,r.lng],{icon:ic(r)}).addTo(map).on("click",()=>openSheet(mk[r.id]._r))}m.setLatLng([r.lat,r.lng]);m._r=r});

function hud(){
 $("#lvl").textContent=lvlOf(me.xp);$("#xpb").style.width=(me.xp%150)/150*100+"%";$("#xpt").textContent=Math.floor(me.xp%150)+" / 150 XP";
 const v=$("#vis");v.classList.toggle("on",me.vis);v.setAttribute("aria-checked",me.vis);
 $("#vtxt").textContent=me.vis?"Les riders proches te voient":"Ta position n'est pas partagée";
 const s=$("#stat");
 if(!watching)s.innerHTML=`<div class="row"><div class="sp"><b>Autorise la localisation</b><div class="mu">${esc(geoErr)||"Pour te voir sur la carte et voir les riders proches."}</div></div><button class="btn sm" id="geo">Autoriser</button></div>`;
 else if(!pos)s.innerHTML=`<div class="mu">Recherche de ta position…</div>`;
 else{const n=near().length;s.innerHTML=`<div class="mu">${n?n+" rider"+(n>1?"s":"")+" autour de toi. Appuie sur l'un d'eux pour le contacter.":"Aucun autre rider autour de toi pour l'instant. Invite tes amis !"}</div>`}

function startGeo(){
 if(!navigator.geolocation){geoErr="La géolocalisation n'est pas disponible sur cet appareil.";return hud()}
 geoErr="";watching=true;hud();
 navigator.geolocation.watchPosition(p=>{
  const n={lat:p.coords.latitude,lng:p.coords.longitude};
  if(riding&&pos){const d=hav(pos,n);if(d>3&&d<300){me.xp+=d/40;me.km+=d/1000;trip.d+=d}}
  const first=!pos;pos=n;if(riding)addMet();
  if(!meM)meM=L.circleMarker([n.lat,n.lng],{radius:9,color:"#14181f",weight:3,fillColor:"#ffc933",fillOpacity:1}).addTo(map);else meM.setLatLng([n.lat,n.lng]);
  if(first)map.setView([n.lat,n.lng],15);
  push();hud();drawMarkers();
 },e=>{watching=false;geoErr=e.code===1?"Autorisation refusée. Autorise la localisation dans les réglages du navigateur.":"Position indisponible. Vérifie que le GPS est activé.";hud()},{enableHighAccuracy:true,maximumAge:3000,timeout:20000});
}

const members=id=>riders.filter(r=>r.clan===id);
const rid=(k,c,f,t)=>[k,c,f,t].join("_");
const pend=(k,c,to)=>reqOut().some(r=>r.k===k&&r.c===c&&r.tu===to&&r.st==="pending");
function joinClan(id,name){me.clan=id;me.cn=name;push(true);toast("Tu as rejoint "+name);if(page==="clans"){renderMine();renderList();renderInv()}}
function leaveClan(){me.clan="";me.cn="";push(true);renderMine();renderList();renderInv()}
function sendReq(row,msg){sb.from("requests").upsert({...row,st:"pending",t:new Date().toISOString()}).then(r=>{if(r.error)fail(r.error);else toast(msg)})}
function requestJoin(cid,name){
 const c=clans.find(c=>c.id===cid);if(!c||!c.o||c.o===uid)return toast("Demande impossible pour ce clan");
 sendReq({id:rid("join",cid,uid,c.o),k:"join",c:cid,cn:name,f:uid,fn:me.n,tu:c.o},"Demande envoyée à "+name);
}
function invite(r){
 if(!me.clan||!r)return;
 sendReq({id:rid("inv",me.clan,uid,r.id),k:"inv",c:me.clan,cn:me.cn,f:uid,fn:me.n,tu:r.id,tn:r.n},"Invitation envoyée à "+r.n);
}
function answer(r,ok){
 if(!r)return;
 sb.from("requests").update({st:r.k==="inv"?(ok?"done":"declined"):(ok?"accepted":"declined")}).eq("id",r.id).then(chk);

function addMet(){const k="rc_met_"+day(),a=LSget(k,[]);let ch=false;near().forEach(r=>{if(!a.includes(r.id)){a.push(r.id);ch=true}});if(ch)LSset(k,a)}
function endTrip(){

 if(km>=0.05){const T=trips();T.unshift({d:day(),t0:trip.t0,km:Math.round(km*100)/100,min});LSset("rc_trips",T.slice(0,100));toast(`Trajet : ${km.toFixed(2)} km · ${min} min · ${(km/(min/60)).toFixed(1)} km/h`)}else toast("Trajet terminé");
}

const claimKey=c=>c.id+"_"+(c.w?"w"+Math.floor(Date.now()/(7*864e5)):day());
function badges(){
 const T=trips(),night=T.some(t=>{const h=new Date(t.t0).getHours();return h>=22||h<5});
 return [["🛴 Premier trajet",T.length>=1],["🛡 En clan",!!me.clan],["📏 50 km",me.km>=50],["📏 100 km",me.km>=100],["🌙 Rider de nuit",night],["⭐ Niveau 5",lvlOf(me.xp)>=5],["🏆 Niveau 10",lvlOf(me.xp)>=10],["📍 Contributeur",pins.some(p=>p.u===uid)],["📅 Organisateur",events.some(e=>e.u===uid)]];
}
function statsHtml(){
 const T=trips(),cl=LSget("rc_claim",{});
 return `<div class="card"><b>Mes stats</b><div class="mu" style="margin:4px 0">${Math.round(me.km*10)/10} km au total · ${T.length} trajet(s) enregistré(s)</div>${T.slice(0,3).map(t=>`<div class="mu">${t.d} · ${t.km} km · ${t.min} min · ${(t.km/(t.min/60)).toFixed(1)} km/h</div>`).join("")||'<div class="mu">Appuie sur GO pour enregistrer ton premier trajet.</div>'}</div>`
 +`<div class="card"><b>Défis</b>`+CH.map(c=>{const v=Math.min(c.v(),c.g),k=claimKey(c);return `<div style="margin-top:10px">${esc(c.t)} <span class="tag">+${c.xp} XP</span><div class="bar"><i style="width:${v/c.g*100}%"></i></div><div class="row"><span class="mu sp">${Math.round(v*10)/10} / ${c.g}</span>${cl[k]?'<span class="tag">Récupéré</span>':v>=c.g?`<button class="btn sm" data-cl="${c.id}">Récupérer</button>`:""}</div></div>`}).join("")+`</div>`
 +`<div class="card"><b>Badges</b><div style="margin-top:8px">`+badges().map(b=>`<span class="bd ${b[1]?"on":""}">${b[0]}</span>`).join("")+`</div></div>`;
}
function bindStats(){document.querySelectorAll("[data-cl]").forEach(b=>b.onclick=()=>{const c=CH.find(c=>c.id===b.dataset.cl),cl=LSget("rc_claim",{}),k=claimKey(c);if(cl[k]||c.v()<c.g)return;cl[k]=1;LSset("rc_claim",cl);me.xp+=c.xp;push(true);toast("+"+c.xp+" XP !");renderMe()})}
/* sélecteur de lieu sur une carte */
let pk2=null,pk2m=null;
const pickIcon=L.divIcon({className:"",html:'<div class="pn" style="font-size:30px">📍</div>',iconSize:[30,30],iconAnchor:[15,28]});
function setP(ll){if(!pk2m)pk2m=L.marker(ll,{draggable:true,icon:pickIcon}).addTo(pk2);else pk2m.setLatLng(ll)}
function pickLocation(init,cb){
 const ov=$("#picker");ov.style.display="block";
 const c=map.getCenter(),start=init||(pos?{lat:pos.lat,lng:pos.lng}:{lat:c.lat,lng:c.lng});
 if(!pk2){pk2=L.map("pmap");L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(pk2);pk2.on("click",e=>setP(e.latlng))}
 pk2.setView([start.lat,start.lng],(init||pos)?16:Math.max(map.getZoom(),13));
 setP(start);setTimeout(()=>pk2.invalidateSize(),60);
 $("#pv").onclick=()=>{const ll=pk2m.getLatLng();ov.style.display="none";cb({lat:ll.lat,lng:ll.lng})};
 $("#pc").onclick=()=>{ov.style.display="none"};
 $("#pg").onclick=()=>{if(!pos)return toast("Position inconnue : active la localisation");setP({lat:pos.lat,lng:pos.lng});pk2.setView([pos.lat,pos.lng],17)};
 const go=async()=>{const q=$("#qs").value.trim();if(!q)return;try{const r=await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&q="+encodeURIComponent(q)),j=await r.json();if(!j[0])return toast("Lieu introuvable");const ll={lat:+j[0].lat,lng:+j[0].lon};setP(ll);pk2.setView([ll.lat,ll.lng],17)}catch(e){toast("Recherche indisponible : place le repère à la main")}};
 $("#qb").onclick=go;$("#qs").onkeydown=e=>{if(e.key==="Enter")go()};
}
/* sorties et annonces */
function renderEv(){
 const p=$("#pg-ev");if(p.querySelector("input:focus,textarea:focus,select:focus"))return;
 p.innerHTML=`<h1>Sorties</h1><div class="seg"><button data-t="ev" class="${evTab==="ev"?"on":""}">Sorties</button><button data-t="ad" class="${evTab==="ad"?"on":""}">Annonces</button></div><div id="evb"></div>`;
 p.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{evTab=b.dataset.t;evForm=false;renderEv()});
 if(evTab==="ev")renderEvents();else renderAds();
}
function renderEvents(){
 const b=$("#evb"),t=Date.now(),list=events.filter(e=>Date.parse(e.at)>t-3*36e5).sort((a,c)=>Date.parse(a.at)-Date.parse(c.at));
 let h=evForm?`<div class="card"><b>Créer une sortie</b><input type="text" id="et" placeholder="Titre (ex : balade bord de mer)" maxlength="60" style="margin-top:8px" value="${esc(evDraft.title)}"><label class="mu">Date et heure</label><input type="datetime-local" id="ed" value="${esc(evDraft.d)}"><label class="mu">Véhicule</label><select id="evv"><option value="all">Tous</option>${Object.entries(VEH).map(([k,v])=>`<option value="${k}">${v[0]} ${v[1]}</option>`).join("")}</select><label class="mu">Lieu du rendez-vous</label><input type="text" id="el" placeholder="Nom du lieu (ex : devant la plage)" maxlength="60" value="${esc(evDraft.place)}"><button class="btn ghost" id="el2" style="margin-bottom:6px">📍 Choisir le lieu sur la carte</button><p class="mu" style="margin-bottom:10px">${evDraft.loc?"✅ Lieu choisi sur la carte":"⚠️ Aucun lieu choisi pour l'instant"}</p><button class="btn" id="eo">Publier</button><button class="btn ghost" id="ex" style="margin-top:8px">Annuler</button></div>`:`<button class="btn" id="en" style="margin-bottom:12px">＋ Créer une sortie</button>`;
 h+=list.length?list.map(e=>{const g=rsvps.filter(r=>r.e===e.id),going=g.some(r=>r.u===uid),vv=VEH[e.v];return `<div class="card"><b>${esc(e.title)}</b><div class="mu">📅 ${fmt(e.at)} · ${vv?vv[0]+" "+vv[1]:"Tous véhicules"}</div>${e.place?`<div class="mu">📍 ${esc(e.place)}</div>`:""}<div class="mu">Par ${esc(e.un)} · ${g.length} participant(s)${pos?" · à "+(hav(pos,e)/1000).toFixed(1)+" km":""}</div><div class="row" style="margin-top:10px;flex-wrap:wrap"><button class="btn sm ${going?"ghost":""}" data-g="${e.id}">${going?"Je n'y vais plus":"J'y vais"}</button><button class="btn sm ghost" data-m="${e.id}">Voir sur la carte</button><a class="btn sm ghost" style="text-decoration:none;display:inline-block" target="_blank" rel="noopener noreferrer" href="https://www.google.com/maps/dir/?api=1&destination=${e.lat},${e.lng}">Y aller</a>${e.u===uid?`<button class="btn sm ghost" data-d="${e.id}">Supprimer</button>`:""}</div></div>`}).join(""):'<div class="mu">Aucune sortie prévue. Crée la première !</div>';
 b.innerHTML=h;
 if($("#en"))$("#en").onclick=()=>{evForm=true;renderEv()};
 if($("#ex"))$("#ex").onclick=()=>{evForm=false;renderEv()};
 if($("#et")){$("#et").oninput=e=>{evDraft.title=e.target.value};$("#ed").onchange=e=>{evDraft.d=e.target.value};$("#ed").oninput=e=>{evDraft.d=e.target.value};$("#evv").value=evDraft.v;$("#evv").onchange=e=>{evDraft.v=e.target.value};$("#el").oninput=e=>{evDraft.place=e.target.value};$("#el2").onclick=()=>pickLocation(evDraft.loc,ll=>{evDraft.loc=ll;renderEv()})}
 if($("#eo"))$("#eo").onclick=async()=>{const title=evDraft.title.trim(),d=evDraft.d;if(!title||!d)return toast("Ajoute un titre et une date");if(!evDraft.loc)return toast("Choisis le lieu du rendez-vous sur la carte");const h=evDraft.loc;
  const r=await sb.from("events").insert({title,v:evDraft.v,place:evDraft.place.trim()||null,lat:h.lat,lng:h.lng,at:new Date(d).toISOString(),u:uid,un:me.n});if(r.error)return fail(r.error);evForm=false;evDraft={title:"",d:"",v:"all",place:"",loc:null};toast("Sortie publiée");renderEv()};
 b.querySelectorAll("[data-g]").forEach(x=>x.onclick=()=>{const id=x.dataset.g+"_"+uid,going=rsvps.some(r=>r.id===id);
  if(going)sb.from("rsvps").delete().eq("id",id).then(chk);else sb.from("rsvps").upsert({id,e:x.dataset.g,u:uid,un:me.n}).then(chk)});
 b.querySelectorAll("[data-m]").forEach(x=>x.onclick=()=>{const e=events.find(e=>e.id===x.dataset.m);gotoTab("map");if(e)map.setView([e.lat,e.lng],16)});
 b.querySelectorAll("[data-d]").forEach(x=>x.onclick=()=>sb.from("events").delete().eq("id",x.dataset.d).then(chk));
}
function renderAds(){
 const b=$("#evb");
 let h=evForm?`<div class="card"><b>Nouvelle annonce</b><input type="text" id="at" placeholder="Titre (ex : pneu 10 pouces)" maxlength="60" style="margin-top:8px"><input type="text" id="ap" placeholder="Prix (ex : 25 €) ou échange" maxlength="20"><textarea id="ad" rows="3" maxlength="300" placeholder="Description"></textarea><p class="mu" style="margin-bottom:10px">Les acheteurs te contactent avec les réseaux de ton profil.</p><button class="btn" id="ao">Publier</button><button class="btn ghost" id="ax" style="margin-top:8px">Annuler</button></div>`:`<button class="btn" id="an" style="margin-bottom:12px">＋ Publier une annonce</button>`;
 h+=ads.slice().sort((a,c)=>Date.parse(c.t)-Date.parse(a.t)).slice(0,50).map(a=>{const o=riders.find(r=>r.id===a.u);return `<div class="card"><b>${esc(a.title)}</b> <span class="tag">${esc(a.price||"")}</span><div class="mu" style="margin:4px 0">${esc(a.d||"")}</div><div class="mu">Par ${esc(a.un)}</div><div>${chips(o&&o.ct,CT,link)}</div>${a.u===uid?`<button class="btn sm ghost" data-x="${a.id}" style="margin-top:8px">Supprimer</button>`:""}</div>`}).join("")||'<div class="mu">Aucune annonce pour l\'instant.</div>';
 b.innerHTML=h;
 if($("#an"))$("#an").onclick=()=>{evForm=true;renderEv()};
 if($("#ax"))$("#ax").onclick=()=>{evForm=false;renderEv()};
 if($("#ao"))$("#ao").onclick=async()=>{const title=$("#at").value.trim();if(!title)return toast("Ajoute un titre");
  const r=await sb.from("ads").insert({title,price:$("#ap").value.trim(),d:$("#ad").value.trim(),u:uid,un:me.n});if(r.error)return fail(r.error);evForm=false;toast("Annonce publiée");renderEv()};
 b.querySelectorAll("[data-x]").forEach(x=>x.onclick=()=>sb.from("ads").delete().eq("id",x.dataset.x).then(chk));
}

/* ---------- classement ---------- */
function renderRank(){
 const p=$("#pg-rank");
 p.innerHTML=`<h1>Classement</h1><div class="seg"><button class="on" data-t="c">Clans</button><button data-t="r">Riders</button><button data-t="n">Proches</button></div><div id="rl"></div>`;
 const list=t=>{let a;
  if(t==="c")a=clans.map(c=>({n:c.n,x:members(c.id).reduce((s,r)=>s+(r.xp||0),0),s:members(c.id).length+" membre(s)",me:c.id===me.clan}));
  else a=riders.filter(r=>r.id!==uid&&(t==="r"||(pos&&r.lat!=null&&hav(pos,r)<30000))).map(r=>({n:r.n,x:r.xp||0,s:"Niv. "+lvlOf(r.xp||0),me:false})).concat([{n:me.n+" (toi)",x:Math.round(me.xp),s:"Niv. "+lvlOf(me.xp),me:true}]);
  a.sort((u,v)=>v.x-u.x);
  $("#rl").innerHTML=a.length?a.map((e,i)=>`<div class="card row" ${e.me?'style="border-color:var(--ac);border-width:2px"':""}><span class="rank">${i<3?["🥇","🥈","🥉"][i]:i+1}</span><div class="sp"><b>${esc(e.n)}</b><div class="mu">${e.s}</div></div><b>${e.x} XP</b></div>`).join(""):'<div class="mu">Rien à classer pour l\'instant.</div>'};
 list("c");p.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{p.querySelectorAll(".seg button").forEach(x=>x.classList.toggle("on",x===b));list(b.dataset.t)});
}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{
 document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x===b));
 page=b.dataset.p;document.querySelectorAll(".pg").forEach(p=>p.classList.toggle("on",p.id==="pg-"+page));
 if(page==="ev")renderEv();if(page==="clans")renderClans();if(page==="rank")renderRank();if(page==="me")renderMe();if(page==="map"){map.invalidateSize();hud()}});
</script>
</body>
</html>
